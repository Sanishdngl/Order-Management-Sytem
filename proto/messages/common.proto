syntax = "proto3";

package common;

// Generic error response
message ErrorResponse {
  int32  code    = 1;
  string message = 2;
  string details = 3;
}

// Pagination request
message PaginationRequest {
  int32 page     = 1;
  int32 per_page = 2;
}

// Pagination metadata in responses
message PaginationMeta {
  int32 total    = 1;
  int32 page     = 2;
  int32 per_page = 3;
  int32 pages    = 4;
}